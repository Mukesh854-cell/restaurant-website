<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order - Mirch & Mint</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>
    <a href="menu.html"><button class="back-to-menu">Back to menu &larr;</button></a>
    <div class="heading-container">
        <h1 class="your-order">Your Order</h1>
    </div>

    <div class="orders-container">
        <div class="items-container"></div>
        <div class="total-price-container"></div>
    </div>

    <form action="" class="order-form">
        <label for="name">Name:</label>
        <input enterkeyhint="next" type="text" id="name" class="name-input" placeholder="Enter your name">

        <label for="phone">Mobile No:</label>
        <input enterkeyhint="next" type="tel" id="phone" class="number-input" placeholder="Enter your mobile no:">

        <label for="address">Address:</label>
        <input enterkeyhint="next" type="text" id="address" class="address-input" placeholder="Enter your address">

        <label for="instructions">Any Instructions?</label>
        <textarea id="instructions" class="instructions" placeholder="Any special requests?"></textarea>

        <button class="place-order">Place Order</button>
    </form>

    <div class="overlay-container">
        <div class="overlay-screen success">
            <p class="js-tick">&check;</p>
            <p class="js-msg"></p>
            <button class="js-close">&times;</button>
        </div>
    </div>
    <div class="dessert-overlay">
        <div class="dessert-card">
            <button class="close-dessert">&times;</button>
            <p class="title"></p>
            <img src="" alt="" class="dessert-img">
            <h3 class="dessert-name"></h3>
            <p class="dessert-price"></p>
            <a href="menu.html">See the menu</a>
        </div>
    </div>

    <script src="checkout.js"></script>
</body>

</html>
